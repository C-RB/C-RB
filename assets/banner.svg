<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .l1 { animation: fade 8s infinite; }
      .l2 { animation: fade 8s infinite 2s; opacity: 0; }
      .l3 { animation: fade 8s infinite 4s; opacity: 0; }
      .l4 { animation: fade 8s infinite 6s; opacity: 0; }
      @keyframes fade { 0% {opacity:0} 4% {opacity:1} 22% {opacity:1} 26% {opacity:0} 100% {opacity:0} }
    </style>
  </defs>
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="240" rx="16" fill="none" stroke="#30363d"/>
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>

  <text x="50" y="100" class="mono" font-size="20" fill="#22d3ee">&gt; whoami</text>
  <text x="50" y="155" class="sans" font-size="54" font-weight="700" fill="url(#accent)">Camilo Rojas</text>

  <g class="mono" font-size="20" fill="#e6edf3">
    <text x="50" y="200" class="l1">full-stack developer</text>
    <text x="50" y="200" class="l2">apps móviles + web de punta a punta</text>
    <text x="50" y="200" class="l3">IA aplicada &amp; visión computacional</text>
    <text x="50" y="200" class="l4">construyendo Lexpa</text>
  </g>
</svg>
