<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#14122e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .l1 { animation: fade 8s infinite; }
      .l2 { animation: fade 8s infinite 2s; opacity: 0; }
      .l3 { animation: fade 8s infinite 4s; opacity: 0; }
      .l4 { animation: fade 8s infinite 6s; opacity: 0; }
      @keyframes fade { 0% {opacity:0; transform:translateY(6px)} 4% {opacity:1; transform:translateY(0)} 22% {opacity:1} 26% {opacity:0} 100% {opacity:0} }
    </style>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <rect width="900" height="260" rx="16" fill="url(#grid)"/>
  <rect width="900" height="260" rx="16" fill="url(#glow1)"/>
  <rect width="900" height="260" rx="16" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#30363d"/>

  <rect x="50" y="62" width="5" height="96" rx="2.5" fill="url(#bar)"/>
  <text x="76" y="82" class="mono" font-size="16" fill="#22d3ee" letter-spacing="3">HOLA, SOY</text>
  <text x="74" y="142" class="sans" font-size="62" font-weight="800" fill="url(#accent)">Camilo Rojas</text>

  <g class="mono" font-size="21" fill="#e6edf3">
    <text x="76" y="196" class="l1">full-stack developer</text>
    <text x="76" y="196" class="l2">apps móviles + web de punta a punta</text>
    <text x="76" y="196" class="l3">IA aplicada &amp; visión computacional</text>
    <text x="76" y="196" class="l4">construyendo Lexpa</text>
  </g>

  <g class="mono" font-size="13" fill="#c7d2fe">
    <rect x="466" y="208" width="104" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="518" y="226" text-anchor="middle">TypeScript</text>
    <rect x="580" y="208" width="116" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="638" y="226" text-anchor="middle">React Native</text>
    <rect x="706" y="208" width="72" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="742" y="226" text-anchor="middle">NestJS</text>
    <rect x="788" y="208" width="68" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="822" y="226" text-anchor="middle">Postgres</text>
  </g>
</svg>
